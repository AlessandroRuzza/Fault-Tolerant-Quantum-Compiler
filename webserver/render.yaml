# Render blueprint. Point Render at the repository root and this file; the
# Docker build context has to be the root because the image compiles the C++
# sources that live above webserver/.
#
# No submodule configuration is needed. Two of this repository's three
# submodules are private, so a hosted builder's recursive init aborts on them
# and leaves the public nlohmann_json empty as collateral; the Dockerfile
# fetches that one itself, pinned to the same revision, when it finds it
# missing.
services:
  - type: web
    name: ftqc-web
    runtime: docker
    plan: free
    dockerfilePath: ./webserver/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      # A compilation pins a core for its whole duration, so this tracks the
      # instance's CPU allowance: the starter plan is half a core, and two
      # simultaneous runs there just make both slow. Raise it in step with the
      # plan — roughly one run per full core.
      - key: FTQC_MAX_CONCURRENT_RUNS
        value: "1"
      # Hard stop per run, in seconds. Kept under the platform's own request
      # timeout: a run that outlives the request holds its slot while the
      # browser has already given up on it.
      - key: FTQC_RUN_TIMEOUT
        value: "60"
      # Routing steps sent to the browser. Beyond this the response is
      # truncated and the UI says so; the metrics still describe the whole run.
      - key: FTQC_MAX_STEPS_RETURNED
        value: "1500"
      - key: FTQC_MAX_UPLOAD_BYTES
        value: "4194304"
